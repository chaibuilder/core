name: Setup
description: Node + pnpm with a warm store cache and dependencies installed.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  registry-url:
    description: >
      npm registry to authenticate against. Only the publish job needs this — it makes
      setup-node write the .npmrc that reads NODE_AUTH_TOKEN.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Reads the version from package.json "packageManager" — do not pin it here as well,
    # or the two drift and installs stop matching the lockfile.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
