name: Labeler

# pull_request_target so that pull requests from forks get labelled too. This workflow
# never checks out or runs pull request code — it only reads the changed file list — so
# the elevated token is not exposed to a contributor's branch.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
