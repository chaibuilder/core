name: Stale

# Closes issues that went quiet, so the tracker reflects what is actually live.
# Pull requests are deliberately left alone — an open PR is someone's work, not a backlog item.

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 90
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: "pinned,security,good first issue,help wanted,P0,P1,blocked"
          stale-issue-message: |
            This issue has had no activity for 90 days, so it is being marked stale.

            If it is still relevant, leave a comment and it stays open. Adding anything new
            helps most — a reproduction, the version you are on now, or confirmation that it
            still happens on the latest release.

            Without a reply it closes in 14 days. A closed issue can always be reopened.
          close-issue-message: |
            Closing after 14 days with no further activity. Comment here if this is still
            happening and we will reopen it.
          operations-per-run: 100
          ascending: true
