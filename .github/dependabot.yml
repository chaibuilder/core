version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      # One pull request for the safe stuff, so the queue stays readable.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Security fixes travel on their own and are never held back by a group.
      security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Peer dependencies are chosen by the host app, not by this package. Bumping the
      # dev copy here does not change what consumers install, and churns the lockfile.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
